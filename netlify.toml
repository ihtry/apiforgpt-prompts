[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["cases/**"]

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/prompt-api/health"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/prompt-api/api/:splat"
  status = 200

[[redirects]]
  from = "/docs"
  to = "/docs.html"
  status = 200
